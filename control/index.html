<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mission Control</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Mission Control</h1>
    <span id="status" class="status status-wait">Connecting…</span>
    <span class="mono" id="sim-time">t = —</span>
    <span class="mono muted" id="sim-date">—</span>
    <span class="mono muted" id="step-count"></span>
    <a id="viewer-link" class="link" href="#" target="_blank" rel="noopener">Open 3D viewer ↗</a>
  </header>

  <main class="grid">
    <!-- Time control -------------------------------------------------- -->
    <section class="card" id="time-card">
      <h2>Time</h2>
      <div class="row">
        <label class="field">Step size
          <span class="input-unit"><input id="step-dt" type="number" min="0" step="any" value="1"><span>s</span></span>
        </label>
        <button id="step-btn" class="primary">Step</button>
      </div>
      <div class="chips" id="step-presets">
        <button data-dt="0.1">0.1 s</button>
        <button data-dt="1">1 s</button>
        <button data-dt="10">10 s</button>
        <button data-dt="60">1 min</button>
        <button data-dt="600">10 min</button>
        <button data-dt="3600">1 h</button>
        <button data-dt="86400">1 day</button>
      </div>

      <h3>Run continuously</h3>
      <div class="row">
        <label class="field">Time warp
          <select id="warp">
            <option value="1">×1 (real time)</option>
            <option value="2">×2</option>
            <option value="5">×5</option>
            <option value="10" selected>×10</option>
            <option value="100">×100</option>
            <option value="1000">×1,000</option>
            <option value="10000">×10,000</option>
            <option value="100000">×100,000</option>
            <option value="1000000">×1,000,000</option>
          </select>
        </label>
        <label class="field">Max step
          <span class="input-unit"><input id="max-step" type="number" min="0.001" step="any" value="60"><span>s</span></span>
        </label>
        <button id="run-btn" class="primary">▶ Run</button>
      </div>
      <label class="check"><input type="checkbox" id="pause-on-event" checked> Pause on events (engine cutoff, contact)</label>
      <div class="mono muted" id="run-stats">Paused</div>

      <h3>Simulation</h3>
      <div class="row">
        <button id="reset-btn" class="danger">Reset to initial state</button>
      </div>
    </section>

    <!-- Spacecraft telemetry ----------------------------------------- -->
    <section class="card" id="craft-card">
      <h2>Spacecraft</h2>
      <div class="row">
        <label class="field grow">Selected
          <select id="craft-select"></select>
        </label>
      </div>
      <dl id="telemetry" class="kv"></dl>
    </section>

    <!-- Thrust --------------------------------------------------------- -->
    <section class="card" id="thrust-card">
      <h2>Thrust <span class="muted small" id="thrust-target"></span></h2>
      <div class="tabs" role="tablist">
        <button role="tab" class="tab active" data-tab="helper" aria-selected="true">Guidance helper</button>
        <button role="tab" class="tab" data-tab="raw" aria-selected="false">Raw vector</button>
      </div>

      <div class="tab-panel" id="tab-helper">
        <div class="row">
          <label class="field">Thrust
            <span class="input-unit"><input id="h-thrust" type="number" min="0" step="any" value="7607"><span>kN</span></span>
          </label>
          <label class="field">Pitch (above horizon)
            <span class="input-unit"><input id="h-pitch" type="number" min="-90" max="90" step="any" value="90"><span>°</span></span>
          </label>
          <label class="field">Heading (from north)
            <span class="input-unit"><input id="h-heading" type="number" step="any" value="90"><span>°</span></span>
          </label>
        </div>
        <div class="row">
          <label class="field">Local frame of
            <select id="h-body" class="body-select"></select>
          </label>
          <label class="field">Mass flow from
            <select id="h-flow-mode">
              <option value="isp">Isp</option>
              <option value="rate">Mass rate</option>
            </select>
          </label>
          <label class="field" id="h-isp-field">Isp
            <span class="input-unit"><input id="h-isp" type="number" min="0" step="any" value="282"><span>s</span></span>
          </label>
          <label class="field hidden" id="h-rate-field">Mass rate
            <span class="input-unit"><input id="h-rate" type="number" step="any" value="-2750"><span>kg/s</span></span>
          </label>
        </div>
        <div class="mono muted small" id="h-preview"></div>
        <div class="row">
          <button id="h-apply" class="primary">Apply thrust</button>
          <button class="cut-btn danger">Cut engine</button>
        </div>
      </div>

      <div class="tab-panel hidden" id="tab-raw">
        <div class="row">
          <label class="field">Frame
            <select id="r-frame">
              <option value="enu">ENU (east, north, up)</option>
              <option value="inertial">Inertial (x, y, z)</option>
            </select>
          </label>
          <label class="field" id="r-body-field">Body
            <select id="r-body" class="body-select"></select>
          </label>
        </div>
        <div class="row">
          <label class="field"><span id="r-l0">F east</span>
            <span class="input-unit"><input id="r-f0" type="number" step="any" value="0"><span>N</span></span>
          </label>
          <label class="field"><span id="r-l1">F north</span>
            <span class="input-unit"><input id="r-f1" type="number" step="any" value="0"><span>N</span></span>
          </label>
          <label class="field"><span id="r-l2">F up</span>
            <span class="input-unit"><input id="r-f2" type="number" step="any" value="0"><span>N</span></span>
          </label>
        </div>
        <div class="row">
          <label class="field">Mass rate (dm/dt)
            <span class="input-unit"><input id="r-rate" type="number" step="any" value="0"><span>kg/s</span></span>
          </label>
        </div>
        <div class="row">
          <button id="r-apply" class="primary">Apply thrust</button>
          <button class="cut-btn danger">Cut engine</button>
        </div>
      </div>
    </section>

    <!-- Staging -------------------------------------------------------- -->
    <section class="card" id="stage-card">
      <h2>Staging <span class="muted small" id="stage-target"></span></h2>
      <div class="row">
        <label class="field">Δv frame
          <select id="s-frame">
            <option value="enu">ENU (east, north, up)</option>
            <option value="inertial">Inertial (x, y, z)</option>
          </select>
        </label>
        <label class="field" id="s-body-field">Body
          <select id="s-body" class="body-select"></select>
        </label>
      </div>
      <div id="s-children" class="children"></div>
      <div class="row">
        <button id="s-add">+ Add child</button>
        <span class="mono muted small" id="s-mass-check"></span>
      </div>
      <div class="row">
        <button id="s-apply" class="primary">Stage</button>
      </div>
    </section>

    <!-- Console --------------------------------------------------------- -->
    <section class="card wide" id="console-card">
      <h2>Command console</h2>
      <div class="console-input">
        <textarea id="console-text" spellcheck="false" rows="3">{"cmd": "info"}</textarea>
        <div class="console-buttons">
          <button id="console-send" class="primary">Send</button>
          <select id="console-examples" aria-label="Insert example command">
            <option value="">Examples…</option>
          </select>
        </div>
      </div>
      <div class="muted small">Ctrl+Enter sends. Every command sent by this page is logged below.</div>
      <ol id="log" class="log"></ol>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
